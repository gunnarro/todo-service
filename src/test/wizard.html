<html lang="en">
<!-- https://github.com/GuxMartin/simple-bootstrap-tabs-wizard -->
<header>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous">
    <!-- Optional theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap-theme.min.css"
          integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp" crossorigin="anonymous">


    <script src="https://code.jquery.com/jquery-2.2.4.min.js"
            integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"
            integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
            crossorigin="anonymous"></script>


    <style>
        .wizard {
            margin: 20px auto;
            background: #fff;
        }

        .wizard .nav-tabs {
            position: relative;
            margin: 40px auto;
            margin-bottom: 0;
            border-bottom-color: #0dcaf0;
        }

        .wizard > div.wizard-inner {
            position: relative;
        }

        .connecting-line {
            height: 2px;
            background: #0dcaf0;
            position: absolute;
            width: 80%;
            margin: 0 auto;
            left: 0;
            right: 0;
            top: 50%;
            z-index: 1;
        }

        .wizard .nav-tabs > li.active > a, .wizard .nav-tabs > li.active > a:hover, .wizard .nav-tabs > li.active > a:focus {
            color: #555555;
            cursor: default;
            border: 0;
            border-bottom-color: transparent;
        }

        span.round-tab {
            position: absolute;
            z-index: 2;
            width: 170px;
            height: 40px;
            line-height: 40px;
            display: inline-block;
            background: #fff;
            border: 2px solid #0dcaf0;
            border-radius: 10px;
            left: 0;
            text-align: center;
            font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 20px;
        }

        /* tab text color */
        span.round-tab i {
            color:#555555;
            text-align: left;
        }

        .wizard li.active span.round-tab {
            background: #fff;
            border: 2px solid #5bc0de;
        }

        .wizard li.active span.round-tab i {
            color: #5bc0de;
        }

        span.round-tab:hover {
            color: #333;
            border: 2px solid #333;
        }

        .wizard .nav-tabs > li {
            width: 25%;
        }

        .wizard li:after {
            content: " ";
            position: absolute;
            left: 46%;
            opacity: 0;
            margin: 0 auto;
            bottom: 0px;
            border: 5px solid transparent;
            border-bottom-color: #5bc0de;
            transition: 0.1s ease-in-out;
        }

        .wizard li.active:after {
            content: " ";
            position: absolute;
            left: 46%;
            opacity: 1;
            margin: 0 auto;
            bottom: 0px;
            border: 10px solid transparent;
            border-bottom-color: #5bc0de;
        }

        .wizard .nav-tabs > li a {
            width: 170px;
            height: 40px;
            margin: 20px auto;
            border-radius: 100%;
            padding: 0;
        }

        .wizard .nav-tabs > li a:hover {
            background: transparent;
        }

        .wizard .tab-pane {
            position: relative;
            padding-top: 50px;
        }

        .tab-content-fixed {
            height: 300px;
        }
    </style>


    <script language="JavaScript">
        $('.btn-toggle').click(function() {
            alert('clicked')
            if ($(this).find('#btn_godkjent').size() > 0) {
                $(this).find('#btn_godkjent').toggleClass('btn-success');
            } else {
                 $(this).find('#btn_godkjent').toggleClass('btn-default');
            }

            if ($(this).find('#btn_ikke_godkjent').size() > 0) {
                $(this).find('#btn_ikke_godkjent').toggleClass('btn-danger');
            } else {
                 $(this).find('#btn_ikke_godkjent').toggleClass('btn-default');
            }
        });
    </script>

    <script language="JavaScript">
        // Wizard
        $(document).ready(function () {
            $('a[data-toggle="tab"]').on('show.bs.tab'
                , function (e) {
                    var $target = $(e.target);
                    if ($target.parent().hasClass('disabled')) {
                        return false;
                    }
                }
            );

            $(".next-step").click(function (e) {
                var $active = $('.wizard .nav-tabs li.active');
                $active.next().removeClass('disabled');
                nextTab($active);
            });

            $(".prev-step").click(function (e) {
                var $active = $('.wizard .nav-tabs li.active');
                prevTab($active);
            });
        });

        function nextTab(elem) {
            $(elem).next().find('a[data-toggle="tab"]').click();
        }

        function prevTab(elem) {
            $(elem).prev().find('a[data-toggle="tab"]').click();
        }
    </script>



</header>
<body>
<div class="container">

    <div class="panel">
        <div class="panel-body">

        <!-- File System Access API rename file by move() function-->
        <!-- https://css-tricks.com/getting-started-with-the-file-system-access-api/ -->
        <!-- input type="file" onchange="rename(this)" -->

        <button id="butOpenFile">Open file</button>

        <script>
            let fileHandle;
            const butOpenFile = document.getElementById("butOpenFile");

            const pickerOptions = {
                multiple: false,
                startIn: 'documents', // Options: 'desktop', 'documents', 'downloads', 'music', 'pictures', 'videos'
                types: [
                   {
                     accept: {
                       "application/xml": ".xml",
                     },
                   },
                 ],
                 excludeAcceptAllOption: true,
            };

            butOpenFile.addEventListener('click', async () => {
              [fileHandle] = await window.showOpenFilePicker(pickerOptions);
              const file = await fileHandle.getFile();
              const content = await file.text();
              console.log(file.name + "\n" +  content)
             // await fileHandle.remove();
             await fileHandle.move(file.name + ".pakket");
            });
        </script>
        <script>
            function readFile(input) {
               let file = input.files[0];
               let reader = new FileReader();
               reader.readAsText(file);
               reader.onload = function() {
                 console.log(reader.result);
               };
               reader.onerror = function() {
                 console.log(reader.error);
               };
             }
        </script>
        </div>
    </div>

        </div>

                        <ul class="nav nav-tabs" role="tablist">

                            <div class="tab-pane" role="tabpanel" id="step3">

                            </div>

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
